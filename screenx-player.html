
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenX Cinema Player</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #status {
    position: absolute;
    top: 45%;
    width: 100%;
    text-align: center;
    color: white;
    font: 18px Arial;
  }
  #audio {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: none;
    padding: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<video id="movie" playsinline muted preload="auto"></video>
<div id="status">Wachten op ScreenX START...</div>
<button id="audio">Geluid aan</button>

<script>
const params = new URLSearchParams(location.search);
const panel = (params.get("panel") || "center").toLowerCase();
const start = Number(params.get("start") || 0);

const movies = {
  left: "flug_left.mp4",
  center: "flug_center.mp4",
  right: "flug_right.mp4"
};

const video = document.getElementById("movie");
const status = document.getElementById("status");
const audio = document.getElementById("audio");

video.src = movies[panel] || movies.center;
video.muted = true;

if (panel === "center") {
  audio.style.display = "block";
  audio.onclick = () => {
    video.muted = false;
    audio.style.display = "none";
    video.play().catch(() => {});
  };
}

function synchronize() {
  if (!start) return;

  const now = Date.now() / 1000;
  const elapsed = now - start;

  if (elapsed < 0) {
    status.textContent =
      "Start over " + Math.ceil(-elapsed) + " sec";
    return;
  }

  if (video.readyState < 1) {
    status.textContent = "Video laden...";
    return;
  }

  if (elapsed >= video.duration) {
    video.pause();
    status.textContent = "Einde";
    return;
  }

  status.textContent = "";

  if (Math.abs(video.currentTime - elapsed) > 0.3) {
    video.currentTime = elapsed;
  }

  if (video.paused) {
    video.play().catch(() => {
      status.textContent = "Klik om af te spelen";
    });
  }
}

setInterval(synchronize, 300);
</script>

</body>
</html>
