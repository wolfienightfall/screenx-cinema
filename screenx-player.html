
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenX Cinema</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}
video {
    width: 100%;
    height: 100%;
    object-fit: fill;
}
#status {
    position: absolute;
    top: 45%;
    width: 100%;
    color: white;
    text-align: center;
    font: 18px Arial;
}
#sound {
    position: absolute;
    bottom: 15px;
    right: 15px;
    padding: 10px;
    display: none;
}
</style>
</head>
<body>

<video id="movie" muted playsinline preload="auto"></video>
<div id="status">ScreenX Cinema - Ready</div>
<button id="sound">Geluid aan</button>

<script>
const params = new URLSearchParams(location.search);

const panel = params.get("panel") || "center";
const start = Number(params.get("start") || 0);

const files = {
    left: "flug_left.mp4",
    center: "flug_center.mp4",
    right: "flug_right.mp4"
};

const video = document.getElementById("movie");
const status = document.getElementById("status");
const sound = document.getElementById("sound");

video.src = files[panel] || files.center;

if (panel === "center") {
    sound.style.display = "block";
    sound.onclick = () => {
        video.muted = false;
        sound.style.display = "none";
        video.play().catch(() => {});
    };
}

function sync() {
    if (!start) {
        status.textContent = "Waiting for START";
        return;
    }

    const elapsed = Date.now() / 1000 - start;

    if (elapsed < 0) {
        status.textContent =
            "Starting in " + Math.ceil(-elapsed);
        return;
    }

    if (!Number.isFinite(video.duration)) {
        status.textContent = "Loading video...";
        return;
    }

    if (elapsed >= video.duration) {
        video.pause();
        status.textContent = "Movie finished";
        return;
    }

    if (Math.abs(video.currentTime - elapsed) > 0.5) {
        video.currentTime = elapsed;
    }

    if (video.paused) {
        video.play().catch(() => {
            status.textContent = "Click to play";
        });
    } else {
        status.textContent = "";
    }
}

video.addEventListener("loadedmetadata", sync);
setInterval(sync, 500);
</script>

</body>
</html>
