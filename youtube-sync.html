
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Life SyncWatch TV</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
#yt {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#status {
  position:absolute;
  top:10px;
  left:10px;
  padding:8px;
  color:white;
  background:#0009;
  pointer-events:none;
}
#sound {
  position:absolute;
  bottom:12px;
  right:12px;
  padding:10px;
  background:#222;
  color:white;
  border:1px solid #aaa;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="yt"></div>
<div id="status">SyncWatch TV</div>
<button id="sound">Geluid aan / Start</button>

<script>
const q = new URLSearchParams(location.search);
const id = q.get("v") || "";
const start = Number(q.get("start") || 0);
const offset = Number(q.get("offset") || 0);
const paused = q.get("paused") === "1";

const status = document.getElementById("status");
const sound = document.getElementById("sound");

let player;
let ready = false;
let begun = false;

function targetTime() {
  if (paused) return Math.max(0,offset);
  return Math.max(
    0, offset + Date.now()/1000 - start
  );
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player("yt", {
    width:"100%",
    height:"100%",
    videoId:id,
    playerVars:{
      playsinline:1,
      controls:1,
      rel:0,
      origin:location.origin
    },
    events:{
      onReady:function(e) {
        ready = true;
        e.target.mute();
        e.target.cueVideoById({
          videoId:id,
          startSeconds:Math.floor(offset)
        });
        sync();
      },
      onError:function(e) {
        status.textContent =
          "YouTube-fout: " + e.data;
      }
    }
  });
}

function sync() {
  if (!ready) return;

  if (paused) {
    player.pauseVideo();
    status.textContent = "Gepauzeerd";
    return;
  }

  const remaining = start - Date.now()/1000;

  if (remaining > 0) {
    status.textContent =
      "Start over " + Math.ceil(remaining) + " sec";
    return;
  }

  const target = targetTime();
  const duration = player.getDuration();

  if (duration > 0 && target >= duration) {
    player.pauseVideo();
    status.textContent = "Video afgelopen";
    return;
  }

  if (!begun) {
    begun = true;
    player.loadVideoById({
      videoId:id,
      startSeconds:target
    });
    return;
  }

  const state = player.getPlayerState();

  if (state === YT.PlayerState.PLAYING) {
    const difference =
      Math.abs(player.getCurrentTime() - target);

    if (difference > 2) {
      player.seekTo(target,true);
    }
    status.textContent = "";
  }
  else if (
    state === YT.PlayerState.PAUSED ||
    state === YT.PlayerState.CUED
  ) {
    player.playVideo();
  }
}

sound.onclick = function() {
  if (!ready) return;
  player.unMute();
  if (!paused && Date.now()/1000 >= start) {
    if (!begun) {
      begun = true;
      player.loadVideoById({
        videoId:id,
        startSeconds:targetTime()
      });
    } else {
      player.playVideo();
    }
  }
};

if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(script);
} else {
  status.textContent = "Wachten op YouTube-link...";
}

setInterval(sync,1000);
</script>
</body>
</html>
